name: Daily Price Scrape

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST
    - cron: '30 7 * * *'   # 1:00 PM IST
    - cron: '30 13 * * *'  # 7:00 PM IST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated dashboard
        run: |
          git config user.name "price-bot"
          git config user.email "bot@itc-price-tracker"
          git add index.html last_run.txt
          git diff --cached --quiet || git commit -m "Price update: $(date +'%Y-%m-%d %H:%M IST')"
          git push
